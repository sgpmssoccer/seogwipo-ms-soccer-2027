<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">

  <title>서귀포중학교축구부</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f5f5f2;
      color: #151515;
      min-height: 100vh;
    }

    .app {
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      background: #ffffff;
    }

    /* 로그인 화면 */
    #loginScreen {
      min-height: 100vh;
      background: #111111;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 34px 25px;
    }

    .season {
      color: #f5c518;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 18px;
    }

    .club-name {
      color: white;
      font-size: 31px;
      line-height: 1.2;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .club-eng {
      color: #9b9b9b;
      font-size: 12px;
      letter-spacing: 1.2px;
      margin-bottom: 48px;
    }

    .login-box {
      background: #ffffff;
      border-radius: 20px;
      padding: 26px 20px;
    }

    .login-title {
      font-size: 22px;
      font-weight: 900;
      margin-bottom: 5px;
    }

    .login-guide {
      color: #777;
      font-size: 13px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 800;
      margin: 16px 0 7px;
    }

    input {
      width: 100%;
      height: 52px;
      border: 1px solid #dddddd;
      border-radius: 12px;
      padding: 0 15px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border: 2px solid #f5c518;
    }

    .login-btn {
      width: 100%;
      height: 54px;
      border: none;
      border-radius: 12px;
      margin-top: 24px;
      background: #f5c518;
      color: #111111;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
    }

    .login-btn:disabled {
      opacity: 0.6;
    }

    #loginMessage {
      min-height: 20px;
      margin-top: 14px;
      color: #d62828;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
    }

    .login-footer {
      color: #666;
      font-size: 11px;
      text-align: center;
      margin-top: 25px;
      line-height: 1.6;
    }

    /* 로그인 성공 화면 */
    #homeScreen {
      display: none;
      min-height: 100vh;
      background: #f5f5f2;
      padding-bottom: 30px;
    }

    .home-header {
      background: #111111;
      color: white;
      padding: 45px 22px 28px;
      border-radius: 0 0 26px 26px;
    }

    .home-season {
      color: #f5c518;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
    }

    .home-title {
      font-size: 24px;
      font-weight: 900;
    }

    .welcome-card {
      margin: 20px;
      background: white;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
    }

    .success {
      display: inline-block;
      background: #fff4b8;
      color: #725b00;
      padding: 7px 11px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 15px;
    }

    .welcome-card h2 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .welcome-card p {
      color: #666;
      font-size: 14px;
      line-height: 1.6;
    }

    #userEmail {
      font-weight: 800;
      color: #111;
      word-break: break-all;
    }

    .logout-btn {
      width: calc(100% - 40px);
      margin: 5px 20px;
      height: 48px;
      background: #111111;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="app">

  <!-- 로그인 -->
  <section id="loginScreen">

    <div class="season">2027 SEASON</div>

    <div class="club-name">
      서귀포중학교<br>
      축구부
    </div>

    <div class="club-eng">
      SEOGWIPO MIDDLE SCHOOL FOOTBALL
    </div>

    <div class="login-box">

      <div class="login-title">LOGIN</div>

      <div class="login-guide">
        선수 · 지도자 전용
      </div>

      <form id="loginForm">

        <label for="email">아이디</label>

        <input
          id="email"
          type="text"
          placeholder="아이디를 입력하세요"
          autocomplete="username"
          required
        >

        <label for="password">비밀번호</label>

        <input
          id="password"
          type="password"
          placeholder="비밀번호를 입력하세요"
          autocomplete="current-password"
          required
        >

        <button
          id="loginButton"
          class="login-btn"
          type="submit"
        >
          로그인
        </button>

      </form>

      <div id="loginMessage"></div>

    </div>

    <div class="login-footer">
      계정은 축구부 관리자가 발급합니다.<br>
      SEOGWIPO MIDDLE SCHOOL FOOTBALL · 2027
    </div>

  </section>


  <!-- 로그인 성공 후 -->
  <section id="homeScreen">

    <div class="home-header">

      <div class="home-season">
        SEOGWIPO MIDDLE SCHOOL FOOTBALL · 2027
      </div>

      <div class="home-title">
        서귀포중학교축구부
      </div>

    </div>

    <div class="welcome-card">

      <div class="success">
        ✓ 로그인 성공
      </div>

      <h2>환영합니다 ⚽️</h2>

      <p>
        Firebase 로그인 연결이 정상적으로 완료되었습니다.
      </p>

      <p style="margin-top:15px;">
        현재 로그인 계정<br>
        <span id="userEmail"></span>
      </p>

    </div>

    <button
      id="logoutButton"
      class="logout-btn"
      type="button"
    >
      로그아웃
    </button>

  </section>

</div>


<script type="module">

  /* Firebase */

  import { initializeApp }
  from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
  }
  from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";


  const firebaseConfig = {

    apiKey: "AIzaSyAUlVM_hOvZIO7Ed9xdDq5AR8MeZ8YhtoE",

    authDomain:
    "seogwipo-ms-soccer-2027.firebaseapp.com",

    projectId:
    "seogwipo-ms-soccer-2027",

    storageBucket:
    "seogwipo-ms-soccer-2027.firebasestorage.app",

    messagingSenderId:
    "410606171127",

    appId:
    "1:410606171127:web:61ba336b6b01762f7f34f2",

    measurementId:
    "G-MXY0BT0CVG"

  };


  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);


  /* 화면 */

  const loginScreen =
  document.getElementById("loginScreen");

  const homeScreen =
  document.getElementById("homeScreen");

  const loginForm =
  document.getElementById("loginForm");

  const emailInput =
  document.getElementById("email");

  const passwordInput =
  document.getElementById("password");

  const loginMessage =
  document.getElementById("loginMessage");

  const loginButton =
  document.getElementById("loginButton");

  const logoutButton =
  document.getElementById("logoutButton");

  const userEmail =
  document.getElementById("userEmail");


  /* 로그인 */

  loginForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    loginMessage.textContent = "";

    loginButton.disabled = true;
    loginButton.textContent = "로그인 중...";


    let loginId = emailInput.value.trim();
    const password = passwordInput.value;


    /*
      나중에는 선수들이

      3.이시후
      2.김민준

      같은 아이디만 입력하게 만들 예정.

      현재 Firebase 연결 테스트 단계에서는
      Firebase에 만들어둔 이메일 계정으로 로그인.
    */

    if (!loginId.includes("@")) {

      loginMessage.textContent =
      "지금 테스트 단계에서는 Firebase 이메일 계정을 입력해주세요.";

      loginButton.disabled = false;
      loginButton.textContent = "로그인";

      return;
    }


    try {

      await signInWithEmailAndPassword(
        auth,
        loginId,
        password
      );

    }

    catch (error) {

      console.error(error);

      loginMessage.textContent =
      "아이디 또는 비밀번호를 확인해주세요.";

    }

    finally {

      loginButton.disabled = false;
      loginButton.textContent = "로그인";

    }

  });


  /* 로그인 상태 확인 */

  onAuthStateChanged(auth, (user) => {

    if (user) {

      loginScreen.style.display = "none";

      homeScreen.style.display = "block";

      userEmail.textContent = user.email;

    }

    else {

      homeScreen.style.display = "none";

      loginScreen.style.display = "flex";

      passwordInput.value = "";

    }

  });


  /* 로그아웃 */

  logoutButton.addEventListener("click", async () => {

    await signOut(auth);

  });

</script>

</body>
</html>
